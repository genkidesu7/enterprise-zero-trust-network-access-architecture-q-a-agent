id: "CMN-C1-721"
name: "Enterprise Zero-Trust Network Access Architecture Q&A Agent"
namespace: "cmn"
version: "0.1.0"
enabled: true
category: "Cat 1"
generation_mode: "llm"
industry: "CMN"

# Opaque compatibility metadata. Not an inheritance selector or gate input.
base_type: "RAGAgent"  # RAGAgent | ChatAgent | ReActAgent | DocGenerationAgent

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
class: "src.graph.graph.ZeroTrustQAGraph"

# Security
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache) — declare every secret/extra
# actually used, or the agent loads with those checks silently disabled.
requires:
  secrets: ["AZURE_OPENAI_API_KEY", "AZURE_OPENAI_ENDPOINT", "AZURE_OPENAI_DEPLOYMENT"]
  extras: ["openai"]
